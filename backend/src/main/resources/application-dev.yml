spring:
  # MySQL
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/order_approval?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root

  # Redis
  redis:
    host: localhost
    port: 6379
    password:
    database: 0

  # RabbitMQ
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 100

# MQ 开关
mq:
  enabled: true

# JWT 配置（生产环境通过环境变量覆盖）
jwt:
  secret: ${JWT_SECRET:zmd-order-approval-secret-key-2024-please-change-in-prod}
  expire-hours: ${JWT_EXPIRE_HOURS:24}
  refresh-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}

# 慢 SQL 阈值（毫秒）
slow-sql:
  threshold-ms: ${SLOW_SQL_THRESHOLD_MS:500}

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志
logging:
  level:
    com.zmd.order: debug
