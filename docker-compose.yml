services:
  mysql:
    # 钉到 8.0.31：Flyway 8.5.13（Spring Boot 2.7 托管版本）对 MySQL 8.0 小版本封顶到 8.0.31，
    # 连 8.0.32+（即 mysql:8.0 当前拉取的 8.0.41）会在启动时抛 Unsupported Database。
    # 升级 Flyway 到 9.x 会与 Spring Boot 2.7 的 FlywayAutoConfiguration 不兼容（缺 FlywayConfigurationCustomizer），
    # 故此处钉 MySQL 版本而非升级 Flyway。改版本后需重建 mysql_data 卷（见交付说明）。
    image: mysql:8.0.31
    container_name: zmd-crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-order_approval}
      MYSQL_USER: ${MYSQL_USERNAME:-order_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_order_app_password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 数据库结构由 Flyway 在应用启动时自动迁移（db/migration/V1~V7），无需挂载 SQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zmd-crm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zmd-crm-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-order_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_rabbitmq_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: zmd-crm-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-order_approval}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      MYSQL_USERNAME: ${MYSQL_USERNAME:-order_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_order_app_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-order_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change_me_rabbitmq_password}
      JWT_SECRET: ${JWT_SECRET:-local_demo_jwt_secret_please_change_32_bytes}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      MQ_ENABLED: ${MQ_ENABLED:-true}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
    ports:
      - "8080:8080"
    volumes:
      - backend_logs:/opt/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
    container_name: zmd-crm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  backend_logs:
